# NPM's nginx, as the version apollo runs renders it (docs/private/SITE.md names it; PLAN §20.1,
# RESOLUTIONS X40): its nginx.conf's http block and the proxy host it generates for the starter, with
# Websockets Support on, Block Common Exploits and Cache Assets off, and the Advanced snippet of PLAN
# §20.4. Only what CI can't have is left out: TLS (NPM terminates it for *.alexh95.com), its logs, its
# resolvers and CDN ranges. It forwards to the stack Caddy on 127.0.0.1:8120, as NPM forwards to
# apollo's published port. CI's e2e-proxy job serves it with the nginx image (`nginx -c` this file).
#
# Upstream of the templates: NginxProxyManager/nginx-proxy-manager, docker/rootfs/etc/nginx/nginx.conf,
# backend/templates/proxy_host.conf (and its _listen, _access, _hsts includes),
# docker/rootfs/etc/nginx/conf.d/include/proxy.conf. When apollo's NPM is upgraded, render them again.

worker_processes auto;
pid /tmp/npm-nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 512; # apollo's NPM still runs the default (PLAN §20.4 raises it at M3)
}

http {
	include                       /etc/nginx/mime.types;
	default_type                  application/octet-stream;
	sendfile                      on;
	server_tokens                 off;
	tcp_nopush                    on;
	tcp_nodelay                   on;
	client_body_temp_path         /tmp/npm-body 1 2;
	proxy_temp_path               /tmp/npm-proxy;
	keepalive_timeout             90s;
	proxy_connect_timeout         90s;
	proxy_send_timeout            90s;
	proxy_read_timeout            90s;
	gzip                          on;
	proxy_ignore_client_abort     off;
	client_max_body_size          2000m;
	server_names_hash_bucket_size 1024;
	proxy_http_version            1.1;
	proxy_set_header              X-Forwarded-Scheme $scheme;
	proxy_set_header              X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header              Accept-Encoding "";
	proxy_cache                   off;
	access_log                    off;

	map $host $forward_scheme {
		default http;
	}

	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	real_ip_header X-Real-IP;
	real_ip_recursive on;

	# The proxy host (proxy_host.conf). On 80, as NPM's: `$host` drops a port, so a browser on any
	# other would send an Origin the app's write guard can't match. One proxy host with the starter's
	# and the streams witness's domains, as NPM renders a host with two: the same settings serve both.
	server {
		set $forward_scheme http;
		set $server         "127.0.0.1";
		set $port           8120;

		listen 80;
		server_name odin-htmx-starter.alexh95.com starter-streams.alexh95.com;
		http2 off;

		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $http_connection;
		proxy_http_version 1.1;

		# Advanced (PLAN §20.4)
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		proxy_request_buffering off;
		client_max_body_size 16m;
		proxy_max_temp_file_size 0;

		location / {
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $http_connection;
			proxy_http_version 1.1;

			# conf.d/include/proxy.conf
			add_header       X-Served-By $host;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Scheme $scheme;
			proxy_set_header X-Forwarded-Proto  $scheme;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_pass       $forward_scheme://$server:$port$request_uri;
		}
	}
}

name: Set up Odin
description: >-
  The pinned Odin release for this runner, SHA-256 checked and cached, on PATH, with what the build
  needs beside it: clang (it links Odin and compiles SQLite), binutils, unzip and brotli (tools/bundle)
  on Linux; brotli on macOS; the MSVC environment on Windows (prepare.bat compiles SQLite with cl).

# The workflow's env carries ODIN_VERSION. Each asset is named here rather than templated, because
# upstream asset names have been irregular (dev-2026-06 shipped a truncated macOS name and an
# arch-less Windows one), so a version-only bump could 404; .github/scripts/check-pins.sh holds
# these names and the linux-amd64 digest to ci.yml's and the Dockerfile's pins.
inputs:
  cache-suffix:
    description: >-
      Set in a container job: actions/cache archives with gzip there (the image has no zstd) and
      with zstd on a host, and the format is part of the entry, so the two can't share one.
    default: ''

runs:
  using: composite
  steps:
    - name: Pick this runner's asset
      id: pick
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   asset=odin-linux-amd64-dev-2026-10.tar.gz; sha=c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab; dir=/opt/odin ;;
          Linux-ARM64) asset=odin-linux-arm64-dev-2026-10.tar.gz; sha=99c43e9670a285901d6cfee5f56197b74c7d6f7c537b35ecba0c1b44ac2e4df8; dir=/opt/odin ;;
          macOS-ARM64) asset=odin-macos-arm64-dev-2026-10.tar.gz; sha=b276c6ac87c3eea17446a6ca9080089b6e9f492057fb773591775ee49d92a1cf; dir=/opt/odin ;;
          Windows-X64) asset=odin-windows-amd64-dev-2026-10.zip;  sha=b6b2e426a8b6f147b74ec7e18bef8df27cf40fe16193159df7ca09a0cc0c2011; dir='C:\odin' ;;
          *) echo "no Odin asset for ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        { echo "asset=$asset"; echo "sha=$sha"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"

    - name: Cache Odin
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.pick.outputs.dir }}
        key: odin-${{ env.ODIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.pick.outputs.sha }}${{ inputs.cache-suffix }}

    - name: Install Odin (Linux, macOS)
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/${{ steps.pick.outputs.asset }}" -o /tmp/odin.tar.gz
        if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
        echo "${{ steps.pick.outputs.sha }}  /tmp/odin.tar.gz" | $sum -c -
        sudo=$(command -v sudo || true)   # a container job runs as root, without sudo
        $sudo mkdir -p /opt/odin
        $sudo tar -xzf /tmp/odin.tar.gz -C /opt/odin --strip-components=1

    - name: Install Odin (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $url = "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_VERSION/${{ steps.pick.outputs.asset }}"
        $zip = "$env:RUNNER_TEMP\odin.zip"
        Invoke-WebRequest -Uri $url -OutFile $zip
        $got = (Get-FileHash $zip -Algorithm SHA256).Hash
        if ($got -ne '${{ steps.pick.outputs.sha }}') { throw "odin.zip SHA-256 is $got, expected ${{ steps.pick.outputs.sha }}" }
        Expand-Archive -Path $zip -DestinationPath C:\odin -Force

    # apt goes through apt-install.sh: one try on the runner's mirror, then HTTPS mirrors on other
    # hosts (port-80 fetches from the runners have timed out for minutes at a time).
    - name: Odin on PATH, clang and brotli (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "/opt/odin" >> "$GITHUB_PATH"
        sh .github/scripts/apt-install.sh clang binutils unzip brotli

    - name: Odin on PATH, brotli (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "/opt/odin" >> "$GITHUB_PATH"
        xcode-select -p   # the Command Line Tools ship clang and ar
        command -v brotli >/dev/null || brew install brotli

    # Held at v1.13.0: upstream has been stale since 2024-03 and still targets Node 20, so this is the
    # one action whose deprecation warning a bump can't clear. It keeps working on Node 24.
    - name: MSVC environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Odin on PATH (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: echo 'C:\odin\dist' >> "$GITHUB_PATH"   # odin.exe and LLVM-C.dll live in dist/

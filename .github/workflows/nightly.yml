name: nightly

# What's too slow or too noisy for every push (PLAN §19.2.1's nightly row). At M1:
# ASan over the e2e suite and a k6 quick run, on Linux. At M2: TSan, the 1 h soak and
# Autobahn|Testsuite against the lab's WebSocket echo.
# Windows ASan, libFuzzer and the combination matrices join with the milestones that need them.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-10
  ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab

jobs:
  # skeleton built with -sanitize:address, then the e2e suite (chromium and the api
  # project) and a k6 quick run against it. Every server writes its reports to
  # /tmp/asan; any report fails the job. use_sigaltstack=0: the crash guard runs
  # its own alternate signal stack, which ASan would otherwise try to unmap as its
  # own at thread exit. Leak checks are off: the suites end servers with SIGKILL.
  asan:
    name: ASan (skeleton, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --security-opt seccomp=unconfined
    env:
      HOME: /root
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:use_sigaltstack=0:log_path=/tmp/asan/report
      K6_VERSION: v2.0.0
      K6_SHA256: 2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
        with:
          cache-suffix: -jammy
      - name: Prepare
        run: sh app/prepare.sh && mkdir -p /tmp/asan
      - name: e2e against the ASan build
        run: cd e2e && npm ci && npx playwright test --project=chromium --project=api
        env:
          CI: 'true'
          E2E_BUILD_FLAGS: -sanitize:address -debug
      - name: k6 quick against the ASan build
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          tar -xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          BUILD_FLAGS="-sanitize:address -debug" sh load-tests/run.sh --quick
      - name: No ASan report
        if: ${{ !cancelled() }}
        run: |
          if ls /tmp/asan/report.* >/dev/null 2>&1; then cat /tmp/asan/report.*; exit 1; fi
          echo "no ASan reports"

  # The TSan gate (PLAN §19.2.1, M2): tools/drills/tsan.sh builds the hub's, stream's,
  # workers' and store/sqlite's tests, lab under streamload's fan-out and skeleton under
  # k6's write and pages with -sanitize:thread, each through its drain. Any report but
  # core:nbio's one suppressed assert (tools/drills/tsan.supp, S0.9) fails it.
  tsan:
    name: TSan (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      K6_VERSION: v2.0.0
      K6_SHA256: 2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
      - name: Prepare
        run: sh app/prepare.sh
      - name: TSan gate
        run: sh tools/drills/tsan.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tsan-logs
          path: app/build/tsan/

  # The soak (PLAN §19.1.8): lab for an hour with 2000 streams, k6's lab scenario at 10
  # VUs and a redeploy at half time (SIGTERM, a new server on the port). RSS and the
  # open fds plateau in each half, the queued bytes stay under 64 MiB, and every stream
  # is back within 5 s of the redeploy.
  soak:
    name: Soak (lab, 1 h, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      K6_VERSION: v2.0.0
      K6_SHA256: 2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
      - name: Prepare
        run: sh app/prepare.sh
      - name: Soak
        run: sh tools/drills/soak.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: soak
          path: app/build/soak/

  # Autobahn|Testsuite's fuzzing client against the lab's WebSocket echo (PLAN §19.1.9,
  # X24): framing, pings and pongs, reserved bits, opcodes, fragmentation, UTF-8, close
  # handling (sections 1–7 and 10). 9 (performance) and 12–13 (permessage-deflate, which
  # the server doesn't offer) are left out. A dev-time image, pinned by digest, exempt as
  # Playwright and k6 are. A case that isn't OK, NON-STRICT or INFORMATIONAL fails it.
  autobahn:
    name: Autobahn|Testsuite (lab's WS echo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Prepare and build lab
        run: sh app/prepare.sh && sh build.sh lab -o:speed
      - name: Serve lab
        run: |
          STREAMS_PER_CLIENT=100000 STREAM_CONNECTS=100000 LOG_LEVEL=warn app/bin/lab 9001 > /tmp/lab.log 2>&1 &
          for i in $(seq 1 100); do curl -fs http://127.0.0.1:9001/readyz >/dev/null && break; sleep 0.1; done
      - name: The fuzzing client
        run: |
          mkdir -p /tmp/autobahn
          docker run --rm --network host -v "$PWD/tests/autobahn:/config" -v /tmp/autobahn:/reports \
            crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074 \
            wstest -m fuzzingclient -s /config/fuzzingclient.json
      - name: Every case passes
        run: |
          jq -r '.lab | to_entries[] | select((.value.behavior | IN("OK", "NON-STRICT", "INFORMATIONAL") | not)
            or (.value.behaviorClose | IN("OK", "INFORMATIONAL") | not))
            | "\(.key) \(.value.behavior) close \(.value.behaviorClose)"' /tmp/autobahn/index.json > /tmp/failed.txt
          echo "$(jq '.lab | length' /tmp/autobahn/index.json) cases, $(wc -l < /tmp/failed.txt) failed"
          cat /tmp/failed.txt
          test ! -s /tmp/failed.txt
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: autobahn
          path: /tmp/autobahn/

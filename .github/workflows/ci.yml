name: ci

# Both default-branch names, so a fork on main keeps its CI. A v* tag runs
# release.yml instead: the images, the GitHub Release and the Fly deploy.
on:
  push:
    branches: [master, main, 'release/**']
  pull_request:
    branches: [master, main]

# Every job only reads the repo. Caches and artifacts go through the runner's own
# token, so nothing needs more.
permissions:
  contents: read

# A new push to a PR supersedes the checks still running on its old head. Pushes
# to the branch get a group per run instead, so they never cancel or queue behind
# each other: every merge runs to the end.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Odin release the Dockerfile pins too. ODIN_SHA256 is the published digest of
# the linux-amd64 tarball (what the Dockerfile downloads); .github/actions/setup-odin
# names every runner's asset and digest, and .github/scripts/check-pins.sh fails the
# pins job if these, the action and the Dockerfile disagree.
env:
  ODIN_VERSION: dev-2026-10
  ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab

# Every job builds, checks and tests through build.sh <profile> (PLAN §20.1), the one
# place a profile's family flags live. The profiles: minimal (memory store, lite
# theme, no SQLite), skeleton (the 1.2.x console on SQLite), lab (the stream
# contract pages on the hyperscript client, memory store) and streams (chat on four
# transports, the Inbox and the nick identity; memory store, lite theme, no SQLite).
jobs:
  # A bump that misses one of the places a pin lives fails here, first.
  pins:
    name: Pins agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sh .github/scripts/check-pins.sh

  # What the compiler can't see (tools/check), every profile checked on its own
  # families, every store checked alone in its family (a store no profile builds
  # can't rot), and the unit tests with bad memory fatal.
  check:
    name: Check + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Prepare (htmx, SQLite, the bundles)
        run: sh app/prepare.sh
      - name: tools/check (imports, profile, routes, contracts)
        run: odin run tools/check -- all
      - name: Every profile on its own families
        run: for p in minimal skeleton lab streams; do CMD=check sh build.sh "$p" || exit 1; done
      - name: Every store alone, in each family
        run: |
          for d in app/stores/*/*/; do
            echo "== $d"
            odin check "$d" -no-entry-point -vet -vet-cast -vet-semicolon -vet-tabs -vet-using-param -disallow-do -strict-style -warnings-as-errors || exit 1
          done
      - name: Unit tests (0 leaks, 0 bad frees)
        run: sh .github/scripts/unit-tests.sh

  # The generator (PLAN §7.4, §20.1): docs/catalog.json is current; every committed
  # profile composes again from its own selection (tools/init's test); a selection
  # the families can't hold is refused with nothing changed; and one feature alone,
  # rotating with the run number, becomes a new project that --verify builds, tests
  # and holds to tools/check before init writes it here.
  generator:
    name: Generator (catalog, profiles, a rotating singleton)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Prepare
        run: sh app/prepare.sh
      - name: The catalog is current
        run: |
          odin run tools/init -- --list --json > /tmp/catalog.json
          diff -u docs/catalog.json /tmp/catalog.json || { echo "run: odin run tools/init -- --list --json > docs/catalog.json"; exit 1; }
      - name: The committed profiles compose again
        run: odin test tools/init
      - name: A refusal changes nothing
        run: |
          if odin run tools/init -- refused --features contacts --store memory --yes; then exit 1; fi
          git diff --exit-code
      - name: A rotating singleton, made and verified
        run: |
          set -- $(sed -n 's/.*{"name": "\([a-z_]*\)", "lines".*/\1/p' docs/catalog.json)
          eval f=\${$(( ${{ github.run_number }} % $# + 1 ))}
          echo "singleton: $f"
          odin run tools/init -- ci-single --features "$f" --yes
          sh app/prepare.sh && CMD=test sh build.sh app

  # Each profile on four platforms: WSL and Docker cover only Linux, and macOS is
  # the arm64-darwin target nobody can test locally (odin-http's kqueue path under
  # core:nbio). minimal also builds with prepare's SQLite step skipped and no
  # library present (D18). The size budgets are Windows -o:speed's (PLAN §18.4).
  # On a private fork macOS minutes bill at 10x and Windows at 2x: drop those legs
  # from `os:` to save them.
  build:
    name: Build + smoke (${{ matrix.profile }}, ${{ matrix.os }}${{ matrix.sqlite == 'none' && ', no SQLite' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # `sqlite` is a dimension of one value so that the `none` entries below can't
    # merge into an existing leg (an include that changes no original value is
    # added to every leg it matches): they become two legs of their own.
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, skeleton, lab, streams]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        sqlite: [linked]
        include:
          - profile: minimal
            write: /notes body=CI+smoke
            budget: 1572864    # 1.5 MiB (ANSWERS round 7)
          - profile: skeleton
            write: /contacts name=CI+Smoke&email=ci@example.com
            budget: 3145728    # 3 MiB (ANSWERS round 10)
          - profile: lab
            write: /compat/htmx2/save name=CI+smoke  # lab has no size budget of its own (§18.4)
          - profile: streams
            write: /notes body=CI+smoke  # nor has streams: its size is recorded (§12.1)
          - { profile: minimal, os: ubuntu-latest, sqlite: none, write: /notes body=CI+smoke }
          - { profile: minimal, os: windows-latest, sqlite: none, write: /notes body=CI+smoke }
          - { profile: lab, os: ubuntu-latest, sqlite: none, write: /compat/htmx2/save name=CI+smoke }
          - { profile: lab, os: windows-latest, sqlite: none, write: /compat/htmx2/save name=CI+smoke }
          - { profile: streams, os: ubuntu-latest, sqlite: none, write: /notes body=CI+smoke }
          - { profile: streams, os: windows-latest, sqlite: none, write: /notes body=CI+smoke }
    env:
      NO_SQLITE: ${{ matrix.sqlite == 'none' && '1' || '' }}
      # Through the environment, not spliced into the script: the form's `&`
      # would be a shell operator there.
      WRITE: ${{ matrix.write }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin

      - name: Prepare (Unix)
        if: runner.os != 'Windows'
        run: sh app/prepare.sh
      - name: Prepare (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: app\prepare.bat

      - name: No SQLite library is present
        if: matrix.sqlite == 'none'
        shell: bash
        run: test ! -e app/vendor/sqlite

      # VERSION reaches x-version and the serving line, so a binary says which
      # commit it is (a local build says "dev").
      - name: Build -o:speed (warnings are errors)
        shell: bash
        run: VERSION=${GITHUB_SHA::7} sh build.sh ${{ matrix.profile }} -o:speed

      - name: Size budget
        if: runner.os == 'Windows' && matrix.sqlite == 'linked' && matrix.budget != ''
        shell: bash
        run: |
          size=$(wc -c < app/bin/${{ matrix.profile }}.exe)
          echo "${{ matrix.profile }}: $size bytes (budget ${{ matrix.budget }})"
          test "$size" -le "${{ matrix.budget }}"

      - name: Tests (the profile's boot checks and its features' tests)
        shell: bash
        run: CMD=test sh build.sh ${{ matrix.profile }}

      # One smoke script for every leg: bash everywhere (Git Bash on Windows, where
      # MSYS resolves bin/<p> to <p>.exe). DB_PATH=:memory: needs no volume.
      - name: Smoke test the binary
        shell: bash
        env:
          DB_PATH: ':memory:'
        run: |
          [ "${{ matrix.profile }}" = skeleton ] || unset DB_PATH   # a memory build has no DB_PATH
          PORT=8099 app/bin/${{ matrix.profile }} &
          pid=$!
          for i in $(seq 1 40); do
            curl -fsS "http://127.0.0.1:8099/healthz" -o /dev/null 2>&1 && break
            sleep 0.25
          done
          set -e
          test "$(curl -fsS http://127.0.0.1:8099/healthz)" = "ok"
          curl -fsS "http://127.0.0.1:8099/"                   -o /dev/null
          curl -fsS "http://127.0.0.1:8099/about"              -o /dev/null
          curl -fsS "http://127.0.0.1:8099/static/app.css"     -o /dev/null
          curl -fsS "http://127.0.0.1:8099/static/htmx.min.js" -o /dev/null
          if [ -n "$WRITE" ]; then # a profile with no write route has none to smoke
            set -- $WRITE
            curl -fsS -X POST "http://127.0.0.1:8099$1" --data "$2" -o /dev/null
          fi
          kill "$pid"

  # Playwright, one engine per runner, in Playwright's image (browsers, their OS
  # deps and node preinstalled). skeleton and lab run in the three engines, streams
  # in chromium and webkit, minimal in chromium (PLAN §19.1.2); the browser-less specs (the `api` project) once per
  # profile. Keep the image tag with @playwright/test in e2e/package-lock.json
  # (check-pins.sh enforces it). Each server the suite starts leaves its route
  # counters, which the coverage job holds against the load run's.
  e2e:
    name: E2E (${{ matrix.profile }}, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      # The server uses io_uring (core:nbio), which Docker's default seccomp blocks.
      options: --security-opt seccomp=unconfined
    # GitHub mounts HOME=/github/home in container jobs, which Firefox refuses to
    # launch under (it wants HOME owned by the current user). /root is.
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: skeleton, browser: chromium, also: --project=api }
          - { profile: skeleton, browser: firefox }
          - { profile: skeleton, browser: webkit }
          - { profile: minimal, browser: chromium, also: --project=api }
          - { profile: lab, browser: chromium, also: --project=api }
          - { profile: lab, browser: firefox }
          - { profile: lab, browser: webkit }
          - { profile: streams, browser: chromium, also: --project=api }
          - { profile: streams, browser: webkit }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
        with:
          cache-suffix: -jammy

      # prepare's outputs, so a shard doesn't spend a minute compiling SQLite: on a
      # hit global-setup finds them current and skips prepare. The key hashes
      # prepare.sh (the pins and flags) and the image's distro (glibc). The build
      # and check jobs run prepare from scratch, so prepare itself stays tested.
      - name: Cache prepare's outputs (htmx, compiled SQLite)
        uses: actions/cache@v6
        with:
          path: |
            app/vendor/htmx/htmx.min.js
            app/vendor/htmx/ext
            app/vendor/hyperscript
            app/vendor/sqlite
          key: prepared-${{ hashFiles('app/prepare.sh', 'app/vendor/htmx/PINS', 'app/vendor/hyperscript/PINS') }}-jammy

      - name: Install e2e deps
        run: cd e2e && npm ci

      - name: Run e2e
        run: cd e2e && npx playwright test --project=${{ matrix.browser }} ${{ matrix.also }}
        env:
          CI: 'true'
          E2E_PROFILE: ${{ matrix.profile }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.profile }}-${{ matrix.browser }}
          path: e2e/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e-${{ matrix.profile }}-${{ matrix.browser }}
          path: app/build/coverage/e2e/${{ matrix.profile }}/*.prom
          retention-days: 7

  # The lab's pages through the proxies apollo puts in front of it (PLAN §20.1, §20.4;
  # RESOLUTIONS X26, X40): the stack Caddy running deploy/Caddyfile as it is, and NPM's
  # nginx (tests/proxy/npm.conf, as the NPM version apollo runs renders its proxy host)
  # in front of that Caddy. The Caddyfile names the real hosts, so /etc/hosts sends them
  # to this runner, and global-setup refuses to run if they resolve anywhere else. The
  # pages go through the proxy; proxy.spec checks streams arrive as written, raw.
  # A host runner, not Playwright's image: the proxies are containers beside it.
  e2e-proxy:
    name: E2E through ${{ matrix.proxy }} (${{ matrix.profile }}, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { proxy: caddy, profile: lab, url: 'http://odin-htmx-starter.alexh95.com:8120' }
          - { proxy: npm, profile: lab, url: 'http://odin-htmx-starter.alexh95.com' }
          - { proxy: caddy, profile: streams, url: 'http://starter-streams.alexh95.com:8120' }
          - { proxy: npm, profile: streams, url: 'http://starter-streams.alexh95.com' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: The stack's hosts, on this runner
        run: |
          for h in odin-htmx-starter houston houston-lab starter-minimal starter-streams starter-skeleton htmx-odin-starter; do
            echo "127.0.0.1 $h.alexh95.com" | sudo tee -a /etc/hosts
          done
      - name: The stack Caddy (deploy/Caddyfile), forwarding to this runner
        run: |
          hosts=""
          for s in starter-full starter-lab starter-minimal starter-streams starter-skeleton; do hosts="$hosts --add-host $s:host-gateway"; done
          docker run -d --name caddy -p 8120:80 $hosts -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
      - name: NPM's nginx, in front of the Caddy
        if: matrix.proxy == 'npm'
        run: |
          docker run -d --name npm --network host --entrypoint nginx -v "$PWD/tests/proxy/npm.conf:/etc/nginx/npm.conf:ro" \
            nginx@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de -g 'daemon off;' -c /etc/nginx/npm.conf
      - name: Install e2e deps and chromium
        run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run e2e (${{ matrix.profile }}) through the proxy
        run: cd e2e && npx playwright test
        env:
          CI: 'true'
          E2E_PROFILE: ${{ matrix.profile }}
          E2E_PROXY: ${{ matrix.url }}
      - name: The proxies' logs
        if: failure()
        run: |
          docker logs caddy 2>&1 | tail -50
          docker logs npm 2>&1 | tail -50 || true

  # Route coverage (PLAN §19.1.11): the k6 quick run of each profile, then every
  # route needs a non-zero counter from it and from e2e, or a waiver with a reason
  # in tests/parity-waivers.txt. Not a performance gate: shared runners measure
  # their neighbours as much as the server; the parity gate runs on the dev PC.
  coverage:
    name: Route coverage (e2e + k6 quick)
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K6_VERSION: v2.0.0
      K6_SHA256: 2ae87d976f6cdba17185bdd980d8819a3a98e9092c6f0638cd58272ecefc8b90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/k6.tar.gz -C /usr/local/bin --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
      - name: Prepare
        run: sh app/prepare.sh
      - name: k6 quick, each profile
        run: |
          sh load-tests/run.sh --quick --strict
          PROFILE=minimal PORT_BASE=8190 sh load-tests/run.sh --quick --strict
          PROFILE=lab PORT_BASE=8150 sh load-tests/run.sh --quick --strict
          PROFILE=streams PORT_BASE=8170 sh load-tests/run.sh --quick --strict
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-e2e-*
          path: /tmp/e2e-coverage
      - name: Every route reached by both suites
        run: |
          for p in minimal skeleton lab streams; do
            mkdir -p app/build/coverage/e2e/$p
            for d in /tmp/e2e-coverage/coverage-e2e-$p-*; do cp "$d"/*.prom app/build/coverage/e2e/$p/ 2>/dev/null || true; done
          done
          odin run tools/check -- parity

  # The request-path drills (PLAN §19.1.10) and budgets, by tools/drills/drills.mjs:
  # a TEST_ROUTES build's pure crashes (500, serving goes on), dirty ones (exit 70),
  # the recovery burst, the watchdog, 10k malformed requests, the shutdown bound with
  # slow, half-sent and idle peers, restart after kill -9, the fd ceiling under a
  # ulimit, boot → /readyz and idle RSS; and the release build's /__test/* is 404.
  # lab adds the stream drills: wsdata, the drain with 500 SSE + 500 WS, the fd
  # ceiling with 3000 streams, and a request right after a stream that crashes.
  # The size budgets are Windows', in the build job; the dev PC runs these on Windows.
  linux-ops:
    name: Drills (${{ matrix.profile }}, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, skeleton, lab, streams]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-odin
      - name: Prepare
        run: sh app/prepare.sh
      - name: Drills and budgets
        run: node tools/drills/drills.mjs ${{ matrix.profile }}

  # The release image (PLAN §20.2) of every hosted profile through compose.yaml, so a
  # broken Dockerfile fails here rather than in the release or Fly's builder, and a
  # fork without either gets its images tested at all. Host runner: it needs the
  # Docker daemon.
  docker:
    name: Docker image (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [minimal, skeleton, lab, streams]
    env:
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker compose build --build-arg VERSION=${GITHUB_SHA::7}

      # --wait returns once the HEALTHCHECK (the binary's --healthcheck) passes, and
      # fails if the container exits or never turns healthy: the server started on a
      # read-only rootfs under docker/seccomp-io-uring.json.
      - name: Start it (compose.yaml)
        run: docker compose up --wait --wait-timeout 60

      - name: Smoke test
        run: |
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
          curl -fsS http://127.0.0.1:8080/licenses | head -1 | grep -q 'THIRD-PARTY NOTICES'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^x-version: ${GITHUB_SHA::7}"
          # Not root: distroless has no `id`, so read the process's UID from the host.
          test "$(ps -o uid= -p "$(docker inspect -f '{{.State.Pid}}' "$(docker compose ps -q app)")" | tr -d ' ')" = "10001"

      # D38 and §20.2: the binary needs only glibc (SQLite is linked in), and the image
      # stays under 25 MB compressed.
      - name: Libraries and size
        run: |
          img=$(docker inspect -f '{{.Image}}' "$(docker compose ps -q app)")
          id=$(docker create "$img") && docker cp "$id:/app/bin" bin && docker cp "$id:/app/SOURCES.md" . && docker rm "$id"
          readelf -d bin | grep NEEDED
          test -z "$(readelf -d bin | grep NEEDED | grep -vE '\[(libc\.so\.6|libm\.so\.6|ld-linux-x86-64\.so\.2)\]')"
          grep -q '^| libc6 | ' SOURCES.md
          bytes=$(docker save "$img" | gzip -c | wc -c)
          echo "image: $bytes bytes compressed"
          test "$bytes" -le $((25 * 1024 * 1024))

      # STOPSIGNAL SIGTERM reaches the server's drain: a clean exit 0 within a
      # second or two. A missed signal shows as a SIGKILL (137) after 10 s.
      - name: docker stop shuts it down cleanly
        run: |
          id=$(docker compose ps -q app)
          start=$(date +%s%N)
          docker compose stop
          ms=$(( ($(date +%s%N) - start) / 1000000 ))
          code=$(docker inspect -f '{{.State.ExitCode}}' "$id")
          echo "stopped in ${ms} ms, exit code ${code}"
          test "$code" = 0 && test "$ms" -lt 6000

      # The non-root user must be able to create the DB (and its -wal/-shm) on a
      # fresh volume at /data, the documented DB_PATH home, and back it up there.
      - name: Persist to a fresh /data volume
        if: matrix.profile == 'skeleton'
        run: |
          img=$(docker inspect -f '{{.Image}}' "$(docker compose ps -aq app)")
          docker run -d --name persist --security-opt seccomp=docker/seccomp-io-uring.json --read-only --tmpfs /tmp \
            -e DB_PATH=/data/data.db -v ci-data:/data "$img"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' persist)" = healthy ] && break
            sleep 1
          done
          docker exec persist /app/bin --backup /data/backup.db
          docker stop persist
          docker run --rm -v ci-data:/d debian:trixie-slim sh -c 'ls -ln /d && test -s /d/data.db && test -s /d/backup.db'

      - name: Container output
        if: ${{ !cancelled() }}
        run: |
          docker compose logs
          docker logs persist || true

  # apollo's stack as deploy/compose.yaml runs it (PLAN §20.4): the four witnesses' images,
  # built here, behind the stack Caddy on 8120, staged beside the Caddyfile and the seccomp
  # profile as promote.ps1 stages them (X21). deploy/stack-test.sh checks each host, the
  # 421 catch-all, the trusted-proxy chain, the hardening and a restart behind the Caddy.
  stack:
    name: The apollo stack (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the four images
        run: |
          for p in minimal streams skeleton lab; do
            docker build -q --build-arg PROFILE=$p --build-arg VERSION=ci -t local/starter-$p:ci .
          done
      - name: The stack, end to end
        run: sh deploy/stack-test.sh
        env:
          IMAGE_PREFIX: local/starter
          TAG: ci

  # The proxies' configuration on its own (PLAN §20.1's proxy-config, X26): caddy validate
  # on deploy/Caddyfile and the docs' snippets, nginx -t on NPM's rendering, every redirect
  # alias bare and deep, the 301, the catch-all's 421 and compose's 8120:80 publish.
  proxy-config:
    name: Proxy config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: sh deploy/proxy-config-test.sh
